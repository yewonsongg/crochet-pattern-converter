schema_version: 1
cases:
  - id: grid_default
    profile: exposure
    seed: 1101
    pattern: grid

  - id: grid_sparse
    profile: exposure
    seed: 1102
    pattern: grid
    pattern_overrides: {rows: 4, columns: 4, pitch_x_px: 135.0, pitch_y_px: 135.0}

  - id: grid_dense
    profile: exposure
    seed: 1103
    pattern: grid
    pattern_overrides: {rows: 8, columns: 8, pitch_x_px: 110.0, pitch_y_px: 110.0}

  - id: grid_all_classes
    profile: exposure
    seed: 1104
    pattern: grid
    pattern_overrides: {rows: 6, columns: 6, pitch_x_px: 125.0, pitch_y_px: 125.0}
    forced_role_classes:
      outer_cells:
        - primitive.ch
        - primitive.slst
        - primitive.sc
        - instructive.loop
      inner_cells:
        - primitive.hdc
        - primitive.dc
        - primitive.tr
        - primitive.dtr
        - compound.together
        - compound.increase
        - compound.post
        - compound.crossed
        - compound.rounded

  - id: grid_interstitial
    profile: exposure
    seed: 1105
    pattern: grid
    pattern_overrides: {rows: 6, columns: 6, pitch_x_px: 125.0, pitch_y_px: 125.0, instruction_count: 4}
    forced_role_classes:
      interstitial:
        - instructive.loop
        - instructive.jb

  - id: radial_default
    profile: exposure
    seed: 1201
    pattern: radial

  - id: radial_dense
    profile: exposure
    seed: 1202
    pattern: radial
    pattern_overrides: {ring_count: 4, outer_count: 16, radius_px: 270.0, phase_deg: 0.0}

  - id: radial_center_ring
    profile: exposure
    seed: 1203
    pattern: radial
    pattern_overrides: {ring_count: 3, outer_count: 12, radius_px: 340.0, phase_deg: 0.0}
    forced_role_classes:
      center: [instructive.ring]

  - id: radial_two_rings
    profile: exposure
    seed: 1204
    pattern: radial
    pattern_overrides: {ring_count: 2, outer_count: 12, radius_px: 340.0, phase_deg: 0.0}

  - id: radial_four_rings
    profile: exposure
    seed: 1205
    pattern: radial
    pattern_overrides: {ring_count: 4, outer_count: 16, radius_px: 400.0, phase_deg: 0.0}

  - id: radial_interstitial
    profile: exposure
    seed: 1206
    pattern: radial
    pattern_overrides: {ring_count: 3, outer_count: 15, radius_px: 390.0, phase_deg: 0.0, instruction_count: 4}
    forced_role_classes:
      interstitial:
        - instructive.loop
        - instructive.jb

  - id: small_symbol_stress
    profile: exposure
    seed: 1301
    pattern: grid
    chart_scale: 0.55
    pattern_overrides: {rows: 8, columns: 8, pitch_x_px: 90.0, pitch_y_px: 90.0}

  - id: overlap_stress
    profile: exposure
    seed: 1302
    pattern: radial
    chart_scale: 1.1
    pattern_overrides: {ring_count: 2, outer_count: 16, radius_px: 190.0, phase_deg: 0.0}
