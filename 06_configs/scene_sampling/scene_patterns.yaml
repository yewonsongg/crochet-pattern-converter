# Preliminary v1 scene-graph rules. Values are visual defaults, not measured
# crochet-chart frequencies. Exposure/realism profiles will select patterns
# and weight eligible classes without changing these geometry rules.
schema_version: 1

canvas:
  width_px: 1280
  height_px: 1280

# One chart scale applies to each symbol's visible size.
# Effective target_visible_px = reference_visible_px * chart_scale *
# relative_size from ../symbol_metrics.yaml. The local canvas stays fixed.
symbol_generation:
  canvas_width_px: 150
  canvas_height_px: 150
  reference_visible_px: 80.0
  chart_scale:
    distribution: truncated_normal
    mean: 1.0
    std: 0.05
    min: 0.9
    max: 1.1

# Pools define eligibility only; profile files will supply selection weights.
class_pools:
  grid_outer:
    - primitive.ch
    - primitive.slst
    - primitive.sc
    - instructive.loop
  grid_inner:
    - primitive.hdc
    - primitive.dc
    - primitive.tr
    - primitive.dtr
    - compound.together
    - compound.increase
    - compound.post
    - compound.crossed
    - compound.rounded
  radial_center:
    - instructive.ring
  radial_stitch_a:
    - primitive.sc
    - primitive.hdc
    - primitive.dc
    - primitive.tr
    - primitive.dtr
    - compound.together
    - compound.increase
    - compound.post
    - compound.crossed
    - compound.rounded
  radial_stitch_b:
    - primitive.ch
    - primitive.slst
    - compound.ch3picot
    - instructive.loop
  instruction_stitches:
    - instructive.loop
    - instructive.jb

patterns:
  grid:
    parameters:
      rows: {distribution: integer_uniform, min: 6, max: 10}
      columns: {distribution: integer_uniform, min: 6, max: 10}
      pitch_x_px: {distribution: uniform, min: 110.0, max: 135.0}
      pitch_y_px: {distribution: uniform, min: 110.0, max: 135.0}
      instruction_count: {distribution: integer_uniform, min: 1, max: 4}
    roles:
      inner_cells:
        count: {kind: grid_interior, rows: rows, columns: columns}
        class_pool: grid_inner
        layout: {kind: centered_grid_interior}
        orientation:
          kind: fixed
          angle_deg: 0.0
          jitter_deg: {distribution: uniform, min: -4.0, max: 4.0}
      outer_cells:
        count: {kind: grid_perimeter, rows: rows, columns: columns}
        class_pool: grid_outer
        layout: {kind: centered_grid_perimeter}
        orientation:
          kind: fixed
          angle_deg: 0.0
          jitter_deg: {distribution: uniform, min: -4.0, max: 4.0}
      interstitial:
        count: {kind: parameter, name: instruction_count}
        class_pool: instruction_stitches
        layout: {kind: sampled_edge_midpoints}
        orientation:
          kind: edge_aligned
          offset_deg: 0.0
          jitter_deg: {distribution: uniform, min: -4.0, max: 4.0}
    edges:
      - {kind: horizontal_neighbor, roles: [inner_cells, outer_cells]}
      - {kind: vertical_neighbor, roles: [inner_cells, outer_cells]}
      - {kind: subdivide_sampled_edges, inserted_role: interstitial}

  radial:
    parameters:
      ring_count: {distribution: integer_uniform, min: 2, max: 4}
      # Number of nodes on the outermost ring. Inner-ring counts grow in
      # proportion to radius and are deterministically rounded.
      outer_count: {distribution: integer_uniform, min: 8, max: 16}
      radius_px: {distribution: uniform, min: 270.0, max: 430.0}
      phase_deg: {distribution: uniform, min: 0.0, max: 360.0}
    roles:
      center:
        count: {kind: fixed, value: 1}
        class_pool: radial_center
        layout: {kind: center}
        orientation: {kind: fixed, angle_deg: 0.0}
      ring_a:
        count: {kind: alternating_radial_rings, parity: odd}
        class_pool: radial_stitch_a
        layout: {kind: concentric_rings, radius: radius_px, phase: phase_deg}
        orientation:
          kind: radial_outward
          zero_direction: top
          positive_direction: clockwise
          offset_deg: 0.0
          jitter_deg: {distribution: uniform, min: -4.0, max: 4.0}
      ring_b:
        count: {kind: alternating_radial_rings, parity: even}
        class_pool: radial_stitch_b
        layout: {kind: concentric_rings, radius: radius_px, phase: phase_deg}
        orientation:
          kind: radial_outward
          zero_direction: top
          positive_direction: clockwise
          offset_deg: 0.0
          jitter_deg: {distribution: uniform, min: -4.0, max: 4.0}
    edges:
      - {kind: cycle_next, roles: [ring_a, ring_b]}
      - {kind: adjacent_ring, inner_roles: [center, ring_a, ring_b], outer_roles: [ring_a, ring_b]}
